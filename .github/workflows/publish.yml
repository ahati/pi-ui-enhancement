name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' # ships npm >= 11.5.5, required for OIDC trusted publishing
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Validate version format (YYYY.MM.DD-r<N>)
        run: |
          VERSION_REGEX='^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-r[0-9]+$'
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$PKG_VERSION" =~ $VERSION_REGEX ]]; then
            echo "::error::package.json version '$PKG_VERSION' does not match YYYY.MM.DD-r<N> (e.g. 2025.10.24-r1)"
            exit 1
          fi

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}" # accept both 2025.10.24-r1 and v2025.10.24-r1
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check (typecheck + tests)
        run: npm run check

      - name: Publish
        # --tag latest is explicit because date-based versions parse as semver
        # prereleases (2026.10.24-r1), and npm refuses to default a prerelease
        # to the latest dist-tag without it. These are primary releases, so
        # latest is correct.
        run: npm publish --provenance --access public --tag latest
